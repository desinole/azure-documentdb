name: Deploy Marp Slides to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'slides/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Create output directory
        run: mkdir -p dist

      - name: Build HTML presentation
        run: |
          marp slides/slides.md \
            --html \
            --allow-local-files \
            --output dist/index.html

      - name: Build PDF presentation
        run: |
          marp slides/slides.md \
            --pdf \
            --allow-local-files \
            --output dist/presentation.pdf

      - name: Build PPTX presentation
        run: |
          marp slides/slides.md \
            --pptx \
            --allow-local-files \
            --output dist/presentation.pptx

      - name: Build glossary page
        run: |
          npm install -g marked
          marked -i slides/glossary.md -o dist/glossary.inner.html
          cat > dist/glossary.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Glossary - Azure DocumentDB</title>
          <style>
            :root { color-scheme: light; }
            body {
              font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
              line-height: 1.6;
              color: #1a1a1a;
              max-width: 760px;
              margin: 0 auto;
              padding: 2rem 1.25rem 4rem;
            }
            h1 { font-size: 2rem; border-bottom: 2px solid #4285f4; padding-bottom: .4rem; }
            h2 {
              font-size: 1.25rem;
              margin-top: 2rem;
              scroll-margin-top: 1rem;
              color: #1a237e;
            }
            h2:target {
              background: #fff7d6;
              padding: .2rem .4rem;
              border-radius: 4px;
            }
            a { color: #1a73e8; }
            p { margin: .4rem 0 0; }
            html { scroll-behavior: smooth; }
          </style>
          </head>
          <body>
          <main>
          EOF
          cat dist/glossary.inner.html >> dist/glossary.html
          cat >> dist/glossary.html << 'EOF'
          </main>
          </body>
          </html>
          EOF
          rm dist/glossary.inner.html

      - name: Copy images
        run: |
          if [ -d "slides/img" ]; then
            cp -r slides/img dist/
          fi

      - name: Create index page
        run: |
          cat > dist/README.md << 'EOF'
          # Azure DocumentDB Presentation

          ## Available Formats

          - [View HTML Presentation](./index.html)
          - [Download PDF](./presentation.pdf)
          - [Download PPTX](./presentation.pptx)
          - [Glossary](./glossary.html)

          ## Source

          The source slides are available in the [slides folder](https://github.com/${{ github.repository }}/tree/main/slides).
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
